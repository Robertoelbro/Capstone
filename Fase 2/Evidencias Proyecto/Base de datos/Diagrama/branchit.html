<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BranchIT · Diagrama de base de datos</title><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:#f6f7f2;color:#263e30}header{padding:16px 24px;border-bottom:1px solid #ccd6c2;background:#fffefb}h1{font-size:24px;margin:0 0 8px}p{margin:5px 0;color:#4d5d50}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px}button,a{padding:9px 14px;border:1px solid #80946e;border-radius:8px;background:#edf2e4;color:#263e30;font:inherit}a{text-decoration:none}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #385d28;outline-offset:3px}main{height:calc(100vh - 175px);overflow:auto;padding:16px}#diagram{display:block;max-width:none;background:white}output{min-width:55px}small{font-size:13px}</style><header><h1>BranchIT · Diagrama de base de datos</h1><p>8 tablas · 10 relaciones · Fuente: modelos del proyecto hasta la migración 0008. Sin datos personales.</p><nav aria-label="Controles del diagrama"><button id="less" aria-label="Reducir zoom">−</button><output id="zoom" aria-live="polite"></output><button id="more" aria-label="Aumentar zoom">+</button><button id="fit">Ajustar al ancho</button><a href="branchit.png" download>Descargar PNG</a><a href="branchit.svg" download>Descargar SVG</a><a href="branchit.sql" download>Ver SQL</a></nav></header><main id="viewport" aria-label="Diagrama ampliable" tabindex="0"><img id="diagram" src="branchit.svg" alt="Diagrama de BranchIT con usuarios, perfiles, ofertas, postulaciones, archivos, notificaciones y entrevistas IA"></main><script>let scale=.5;const img=document.getElementById('diagram');function setScale(s){scale=Math.max(.25,Math.min(2,s));img.style.width=(2300*scale)+'px';document.getElementById('zoom').value=Math.round(scale*100)+'%'}document.getElementById('less').onclick=()=>setScale(scale-.1);document.getElementById('more').onclick=()=>setScale(scale+.1);function fit(){setScale((document.getElementById('viewport').clientWidth-32)/2300)}document.getElementById('fit').onclick=fit;fit();</script></html>
